name: Bangun aplikasi iPhone

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    name: Uji dan bangun (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Buat proyek Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Uji di simulator iPhone
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild test -project BacaKamera.xcodeproj -scheme BacaKamera \
            -destination "id=$UDID" -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -120

      - name: Bangun aplikasi untuk iPhone (tanpa tanda tangan)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project BacaKamera.xcodeproj -scheme BacaKamera \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BacaKamera.app Payload/
          zip -qr BacaKamera-unsigned.ipa Payload
          ls -la BacaKamera-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BacaKamera-unsigned-ipa
          path: ios/BacaKamera-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hasil-uji
          path: ios/TestResults
